<html lang="en">
<head>
    <meta charset="UTF-8">

    <style>
        /* Custom styles for the Inter font and futuristic color scheme */
        body {
            font-family: 'Inter', sans-serif;
            scroll-behavior: smooth;
            background-color: #1a1a2e; /* Deep Space Blue/Purple Background */
            color: #e0e0e0; /* Light Gray text */
        }
        /* Style for interactive buttons/links */
        .btn-primary {
            @apply inline-block px-8 py-3 text-lg font-semibold text-white bg-gradient-to-r from-cyan-500 to-blue-600 rounded-full shadow-lg hover:from-cyan-600 hover:to-blue-700 transition duration-300 ease-in-out transform hover:scale-105;
        }
        .btn-secondary {
            @apply inline-block px-8 py-3 text-lg font-semibold text-cyan-400 border-2 border-cyan-400 rounded-full hover:bg-cyan-900 hover:bg-opacity-20 transition duration-300 ease-in-out transform hover:scale-105;
        }
        .section-heading {
            @apply text-5xl font-extrabold text-white mb-6;
        }
        .card {
            @apply bg-gray-900 bg-opacity-70 backdrop-blur-md rounded-xl shadow-lg p-8 transform transition-transform duration-300 hover:scale-105 hover:shadow-2xl border border-gray-700;
        }
        /* Keyframes for animations */
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes pulseSlow {
            0%, 100% { transform: scale(1); opacity: 0.1; }
            50% { transform: scale(1.2); opacity: 0.2; }
        }
        .animate-fade-in-down { animation: fadeInDown 1s ease-out forwards; }
        .animate-fade-in-up { animation: fadeInUp 1s ease-out forwards; animation-delay: 0.3s; }
        .animate-fade-in { animation: fadeIn 1s ease-out forwards; animation-delay: 0.6s; }
        .animate-pulse-slow { animation: pulseSlow 6s infinite ease-in-out; }

        /* Slideshow specific styles */
        .slideshow-container {
            position: relative;
            max-width: 800px;
            margin: auto;
            border-radius: 1rem; /* rounded-xl */
            overflow: hidden;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05); /* shadow-lg */
            border: 1px solid #4a4a4a; /* border-gray-700 */
        }
        .mySlides {
            display: none;
        }
        .mySlides img {
            width: 100%;
            display: block;
            border-radius: 1rem; /* Inherit from container */
        }
        .prev, .next {
            cursor: pointer;
            position: absolute;
            top: 50%;
            width: auto;
            padding: 16px;
            margin-top: -22px;
            color: white;
            font-weight: bold;
            font-size: 18px;
            transition: 0.6s ease;
            border-radius: 0 3px 3px 0;
            user-select: none;
            background-color: rgba(0, 0, 0, 0.5);
        }
        .next {
            right: 0;
            border-radius: 3px 0 0 3px;
        }
        .prev:hover, .next:hover {
            background-color: rgba(0, 0, 0, 0.8);
        }
        .text-slide {
            color: #f2f2f2;
            font-size: 15px;
            padding: 8px 12px;
            position: absolute;
            bottom: 8px;
            width: 100%;
            text-align: center;
            background-color: rgba(0, 0, 0, 0.6);
            border-radius: 0 0 1rem 1rem;
        }
        .dots-container {
            text-align: center;
            padding: 20px;
        }
        .dot {
            cursor: pointer;
            height: 15px;
            width: 15px;
            margin: 0 2px;
            background-color: #bbb;
            border-radius: 50%;
            display: inline-block;
            transition: background-color 0.6s ease;
        }
        .active-dot, .dot:hover {
            background-color: #717171;
        }
    </style>
</head>
